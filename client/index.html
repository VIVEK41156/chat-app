    <script>
      // Automatically reload page if a deployment chunk mismatch occurs
      window.addEventListener('error', function(e) {
        if (e && e.message && (
          e.message.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          e.message.indexOf('Importing a module script failed') !== -1 ||
          e.message.indexOf('Unexpected token <') !== -1
        )) {
          console.warn('Vite chunk mismatch detected, reloading...');
          window.location.reload();
        }
      });
    </script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #111b21;
        color: #e9edef;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .whatsapp-spin {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(0, 168, 132, 0.2);
        border-top-color: #00a884;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
