<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>WhatsApp Web - Real-Time Chat & Friends</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Automatically reload page if a deployment chunk mismatch occurs
      window.addEventListener('error', function(e) {
        if (e && e.message && (
          e.message.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          e.message.indexOf('Importing a module script failed') !== -1 ||
          e.message.indexOf('Unexpected token <') !== -1
        )) {
          console.warn('Vite chunk mismatch detected, reloading...');
          window.location.reload();
        }
      });
    </script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #111b21;
        z-index: 9999;
      }
      #initial-loader video {
        width: 100%;
        height: 100%;
        max-height: 100vh;
        object-fit: contain;
      }
    </style>
  </head>
  <body class="bg-[#111b21] text-[#e9edef] font-['Segoe_UI',_Helvetica_Neue,_Helvetica,_Lucida_Grande,_Arial,_sans-serif] antialiased overflow-hidden select-none">
    <div id="root">
      <!-- High Performance Native Splash Video Loader until React Mounts -->
      <div id="initial-loader">
        <video src="/assets/pre-loader.mp4" autoplay muted playsinline webkit-playsinline="true" preload="auto"></video>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
